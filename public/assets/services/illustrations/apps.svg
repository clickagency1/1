<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ap-glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1c3a1f"/>
      <stop offset="100%" stop-color="#0a1710"/>
    </radialGradient>
    <linearGradient id="ap-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8df252"/>
      <stop offset="100%" stop-color="#3f9e1c"/>
    </linearGradient>
    <pattern id="ap-dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.4" fill="#ffffff" opacity=".08"/>
    </pattern>
  </defs>

  <rect width="1000" height="1000" fill="url(#ap-glow)"/>
  <rect width="1000" height="1000" fill="url(#ap-dots)"/>

  <!-- main phone -->
  <g transform="translate(370,140)">
    <rect x="0" y="0" width="270" height="560" rx="42" fill="#0d1c12" stroke="#ffffff" stroke-opacity=".2" stroke-width="3"/>
    <rect x="14" y="34" width="242" height="492" rx="20" fill="#101f15"/>
    <rect x="100" y="14" width="70" height="12" rx="6" fill="#0a1710"/>

    <!-- status/header -->
    <rect x="34" y="58" width="120" height="14" rx="7" fill="#ffffff" opacity=".55"/>
    <circle cx="222" cy="65" r="12" fill="#8df252" opacity=".8"/>

    <!-- card -->
    <rect x="34" y="96" width="202" height="120" rx="16" fill="url(#ap-accent)" opacity=".9"/>
    <rect x="54" y="120" width="100" height="12" rx="6" fill="#0a1710" opacity=".7"/>
    <rect x="54" y="142" width="140" height="10" rx="5" fill="#0a1710" opacity=".5"/>

    <!-- list items -->
    <g fill="#ffffff" opacity=".08">
      <rect x="34" y="236" width="202" height="56" rx="12"/>
      <rect x="34" y="302" width="202" height="56" rx="12"/>
      <rect x="34" y="368" width="202" height="56" rx="12"/>
    </g>
    <circle cx="60" cy="264" r="14" fill="#8df252" opacity=".7"/>
    <circle cx="60" cy="330" r="14" fill="#ffffff" opacity=".3"/>
    <circle cx="60" cy="396" r="14" fill="#ffffff" opacity=".3"/>
    <rect x="86" y="257" width="120" height="10" rx="5" fill="#ffffff" opacity=".5"/>
    <rect x="86" y="323" width="120" height="10" rx="5" fill="#ffffff" opacity=".4"/>
    <rect x="86" y="389" width="90" height="10" rx="5" fill="#ffffff" opacity=".4"/>

    <!-- bottom nav -->
    <rect x="14" y="460" width="242" height="66" rx="18" fill="#0a1710" opacity=".6"/>
    <circle cx="70" cy="493" r="14" fill="#8df252"/>
    <circle cx="135" cy="493" r="10" fill="#ffffff" opacity=".3"/>
    <circle cx="200" cy="493" r="10" fill="#ffffff" opacity=".3"/>
  </g>

  <!-- floating chat bubble -->
  <g transform="translate(120,300)">
    <rect x="0" y="0" width="180" height="100" rx="22" fill="#0d1c12" stroke="#ffffff" stroke-opacity=".2"/>
    <path d="M30 100 L30 130 L64 100 Z" fill="#0d1c12" stroke="#ffffff" stroke-opacity=".2"/>
    <rect x="24" y="28" width="120" height="12" rx="6" fill="#ffffff" opacity=".5"/>
    <rect x="24" y="52" width="80" height="10" rx="5" fill="#ffffff" opacity=".3"/>
  </g>

  <!-- floating notification -->
  <g transform="translate(700,220)">
    <circle cx="46" cy="46" r="46" fill="url(#ap-accent)" opacity=".92"/>
    <path d="M28 46 l12 12 l24 -28" stroke="#0a1710" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- floating app icon grid -->
  <g transform="translate(680,540)">
    <rect x="0" y="0" width="150" height="150" rx="24" fill="#0d1c12" stroke="#ffffff" stroke-opacity=".2"/>
    <rect x="20" y="20" width="46" height="46" rx="12" fill="#8df252" opacity=".6"/>
    <rect x="84" y="20" width="46" height="46" rx="12" fill="#ffffff" opacity=".14"/>
    <rect x="20" y="84" width="46" height="46" rx="12" fill="#ffffff" opacity=".14"/>
    <rect x="84" y="84" width="46" height="46" rx="12" fill="#8df252" opacity=".35"/>
  </g>

  <circle cx="150" cy="700" r="4" fill="#ffffff" opacity=".3"/>
  <circle cx="860" cy="420" r="3" fill="#8df252" opacity=".6"/>
</svg>
