<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ec-glow" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1c3a1f"/>
      <stop offset="100%" stop-color="#0a1710"/>
    </radialGradient>
    <linearGradient id="ec-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8df252"/>
      <stop offset="100%" stop-color="#3f9e1c"/>
    </linearGradient>
    <pattern id="ec-dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.4" fill="#ffffff" opacity=".08"/>
    </pattern>
  </defs>

  <rect width="1000" height="1000" fill="url(#ec-glow)"/>
  <rect width="1000" height="1000" fill="url(#ec-dots)"/>

  <!-- shopping bag -->
  <g transform="translate(300,220)">
    <path d="M40 130 L60 20 L340 20 L360 130 Z" fill="none" stroke="#ffffff" stroke-opacity=".2" stroke-width="3"/>
    <path d="M40 130 L370 130 L340 560 Q340 585 315 585 L85 585 Q60 585 60 560 Z" fill="url(#ec-accent)" opacity=".93"/>
    <path d="M120 130 C120 60 150 20 200 20 C250 20 280 60 280 130" fill="none" stroke="#0a1710" stroke-width="14" stroke-linecap="round"/>
    <rect x="120" y="260" width="180" height="14" rx="7" fill="#0a1710" opacity=".55"/>
    <rect x="120" y="300" width="130" height="14" rx="7" fill="#0a1710" opacity=".4"/>
    <circle cx="200" cy="410" r="46" fill="#0a1710" opacity=".18"/>
    <text x="200" y="422" text-anchor="middle" font-family="Arial" font-size="34" fill="#0a1710" opacity=".8">%</text>
  </g>

  <!-- product cards -->
  <g transform="translate(660,190)">
    <rect x="0" y="0" width="220" height="250" rx="16" fill="#0d1c12" stroke="#ffffff" stroke-opacity=".16"/>
    <rect x="18" y="18" width="184" height="130" rx="10" fill="#ffffff" opacity=".08"/>
    <circle cx="110" cy="83" r="34" fill="#8df252" opacity=".55"/>
    <rect x="18" y="164" width="140" height="12" rx="6" fill="#ffffff" opacity=".5"/>
    <rect x="18" y="186" width="90" height="10" rx="5" fill="#ffffff" opacity=".3"/>
    <rect x="18" y="212" width="70" height="24" rx="12" fill="#8df252"/>
  </g>
  <g transform="translate(660,470)">
    <rect x="0" y="0" width="220" height="180" rx="16" fill="#0d1c12" stroke="#ffffff" stroke-opacity=".16"/>
    <rect x="18" y="18" width="184" height="90" rx="10" fill="#ffffff" opacity=".08"/>
    <rect x="18" y="122" width="120" height="12" rx="6" fill="#ffffff" opacity=".5"/>
    <rect x="18" y="144" width="184" height="20" rx="10" fill="#ffffff" opacity=".06" stroke="#ffffff" stroke-opacity=".14"/>
  </g>

  <!-- payment / card element -->
  <g transform="translate(130,640)">
    <rect x="0" y="0" width="290" height="170" rx="18" fill="#0d1c12" stroke="#ffffff" stroke-opacity=".2"/>
    <rect x="0" y="36" width="290" height="26" fill="#8df252" opacity=".85"/>
    <rect x="22" y="96" width="90" height="12" rx="6" fill="#ffffff" opacity=".55"/>
    <rect x="22" y="118" width="150" height="10" rx="5" fill="#ffffff" opacity=".3"/>
    <circle cx="240" cy="112" r="20" fill="#ffffff" opacity=".16"/>
    <circle cx="258" cy="112" r="20" fill="#8df252" opacity=".5"/>
  </g>

  <!-- cart trail -->
  <path d="M120 860 C 320 900, 600 900, 860 800" stroke="#8df252" stroke-opacity=".2" stroke-width="2" fill="none"/>
  <circle cx="880" cy="720" r="4" fill="#ffffff" opacity=".3"/>
  <circle cx="90" cy="150" r="3" fill="#8df252" opacity=".6"/>
</svg>
